[package]
name = "alacritty_tabbed_deps"
version = "0.1.0"
license = "Apache-2.0"
description = "Dependencies Alacritty Tabbed adds to Alacritty's, re-exported for the fork's code"
edition.workspace = true
rust-version.workspace = true
publish = false

# Kept out of upstream's `alacritty/Cargo.toml`, so syncing with upstream does not conflict.
# `png` and `windows-sys` are upstream's own dependencies too, here enabled on every platform
# (`png`) or with more features (`windows-sys`); cargo unifies those features across the
# workspace. `resvg` draws SVG profile icons; without default features it has no text or font
# support, and it reuses the `tiny-skia` already in Cargo.lock. The font picker lists fonts with
# the libraries crossfont already uses on each platform. On macOS the AppKit bindings, upstream's
# own, place the window buttons beside the bar and read how round its corners are.

[dependencies]
png = { version = "0.17.5", default-features = false }
resvg = { version = "0.45.1", default-features = false }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
yeslogic-fontconfig-sys = "5.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "20.1.0"
objc2 = "0.6.1"
objc2-foundation = { version = "0.3.1", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3.1", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(windows)'.dependencies]
dwrote = "0.11.5"
windows-sys = { version = "0.59", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]}
