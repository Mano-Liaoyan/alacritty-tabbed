# CI for the Alacritty Tabbed fork. Upstream's ci.yml is disabled in this repository
# (`gh workflow disable ci.yml`), so that file stays identical to upstream.

name: Tabbed CI

on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libfreetype6-dev libfontconfig1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev scdoc
      - name: Stable
        run: cargo test
      - name: Stable (no default features)
        run: cargo test -p alacritty_terminal --no-default-features
      # Lints run on the MSRV toolchain, as in upstream's CI, so that a newer stable
      # clippy cannot fail the build on unchanged upstream code.
      - name: Oldstable
        run: |
          rustup default $(cat Cargo.toml | grep "rust-version" | sed 's/.*"\(.*\)".*/\1/')
          cargo test
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets
      - name: Wayland and X11 only
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test -p alacritty --no-default-features --features=wayland
          cargo test -p alacritty --no-default-features --features=x11
      - name: Man pages
        if: runner.os == 'Linux'
        run: for page in extra/man/*.scd; do scdoc < "$page" > /dev/null; done

  rustfmt:
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-10-21
    steps:
      - uses: actions/checkout@v4
      - name: Rustfmt
        run: |
          rustup toolchain install $NIGHTLY --profile minimal -c rustfmt
          cargo +$NIGHTLY fmt -- --check

  check-macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install target
        run: rustup update && rustup target add x86_64-apple-darwin
      - name: Build
        run: cargo build --target=x86_64-apple-darwin
